<div style="margin:0;padding:0;background:#f7f5fc;color:#17151c;font-family:Inter,Segoe UI,Arial,sans-serif;">
  <div style="max-width:560px;margin:0 auto;padding:36px 20px;">
    <div style="background:#ffffff;border:1px solid #e5e0ef;border-radius:18px;padding:28px;box-shadow:0 18px 45px rgba(35,28,50,.10);">
      <p style="margin:0 0 10px;color:#256899;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;">Booked members</p>
      <h1 style="margin:0 0 12px;font-size:30px;line-height:1.08;color:#17151c;">Reset your Booked password</h1>
      <p style="margin:0 0 22px;color:#625d70;font-size:15px;line-height:1.55;">
        Use this link to choose a new password for your Booked member account.
      </p>
      <p style="margin:0 0 26px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 18px;background:#256899;color:#ffffff;text-decoration:none;border-radius:999px;font-weight:800;">
          Change password
        </a>
      </p>
      <p style="margin:0;color:#777181;font-size:13px;line-height:1.5;">
        If you did not request this, you can ignore this email.
      </p>
    </div>
  </div>
</div>
